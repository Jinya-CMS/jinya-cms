openapi: 3.1.0
info:
  title: Jinya CMS API
  version: 26.0.0
  contact:
    name: Jinya Developers
    url: https://github.com/Jinya-CMS/Jinya-CMS
    email: developers@jinya.de
  license:
    name: MIT
    url: https://github.com/Jinya-CMS/Jinya-CMS/blob/main/LICENSE
  description: This API docs specifies the Jinya CMS API for version 26.0.0
  x-logo:
    url: https://raw.githubusercontent.com/Jinya-CMS/jinya-cms/main/public/designer/favicons/favicon-light.png
    backgroundColor: '#FFFFFF'
    altText: Jinya logo
servers:
  - url: https://{yourServer}
    description: Your server of Jinya CMS
    variables:
      yourServer:
        default: localhost:8080
        description: The server your Jinya CMS instance is installed on
tags:
  - name: authentication
    description: User authentication
    x-displayName: User authentication
  - name: statistics
    description: Statistics
    x-displayName: Statistics
  - name: media
    description: Media
    x-displayName: Media
  - name: folders
    description: Folder management
    x-displayName: Folder management
  - name: files
    description: File management
    x-displayName: File management
  - name: galleries
    description: Gallery management
    x-displayName: Gallery management
  - name: classic-pages
    description: Classic page management
    x-displayName: Classic page management
  - name: modern-pages
    description: Modern page management
    x-displayName: Modern page management
  - name: forms
    description: Form management
    x-displayName: Form management
  - name: blog-posts
    description: Blog post management
    x-displayName: Blog post management
  - name: blog-categories
    description: Blog categories management
    x-displayName: Blog categories management
  - name: themes
    description: Theme management
    x-displayName: Theme management
  - name: menus
    description: Menu management
    x-displayName: Menu management
  - name: my-profile
    description: My profile
    x-displayName: My profile
  - name: active-sessions
    description: Active sessions
    x-displayName: Active sessions
  - name: known-devices
    description: Known devices
    x-displayName: Known devices
  - name: update
    description: Update and version
    x-displayName: Update and version
  - name: configuration
    description: Configuration
    x-displayName: Configuration
  - name: php-info
    description: PHP info
    x-displayName: PHP info
  - name: cache
    description: Cache
    x-displayName: Cache
  - name: mysql
    description: MySQL info
    x-displayName: MySQL info
  - name: query-tool
    description: Query tool
    x-displayName: Query tool
  - name: artists
    description: Artist management
    x-displayName: Artist management
  - name: utilities
    description: Utilities
    x-displayName: Utilities
paths:
  /api/api-key:
    get:
      summary: List api keys
      tags:
        - active-sessions
      responses:
        '200':
          description: Successfully got all api keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-key-list'
        '401':
          description: Api Key is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: get_all_api_keys
      description: Gets all currently valid api keys
      security:
        - header-auth: []
        - cookie-auth: []
  /api/api-key/{key}:
    parameters:
      - name: key
        schema:
          type: string
        in: path
        required: true
    delete:
      summary: Delete api key
      operationId: delete_api_key
      responses:
        '204':
          description: Succesfully deleted the api key
        '401':
          description: Api Key is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: The specified api key was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      tags:
        - active-sessions
      security:
        - header-auth: []
        - cookie-auth: []
      description: Deletes the api key given in the request path
  /api/user:
    get:
      summary: List users
      responses:
        '200':
          description: Successfully returned all users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user-list'
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: get_all_users
      description: Gets a list of all users (artists)
      tags:
        - artists
      security:
        - header-auth: []
        - cookie-auth: []
    post:
      summary: Create user
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
        '400':
          description: Missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '409':
          description: Email address is in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: create_user
      description: Creates a new user (artist)
      security:
        - header-auth: []
        - cookie-auth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-user-request'
      tags:
        - artists
  /api/user/{id}:
    parameters:
      - name: id
        schema:
          type: integer
        in: path
        required: true
    put:
      summary: Update user by id
      responses:
        '204':
          description: Successfully updated user
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '409':
          description: Email address is not unique
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: update_user
      description: Updates the user with the given id
      security:
        - header-auth: []
        - cookie-auth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-user-request'
      tags:
        - artists
    delete:
      summary: Delete user by id
      responses:
        '204':
          description: User successfully deleted
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: delete_user
      security:
        - header-auth: []
        - cookie-auth: []
      description: Deletes the given user
      tags:
        - artists
    get:
      summary: Get user by id
      responses:
        '200':
          description: Successfully got the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: get_user_by_id
      description: Gets the user with the given id
      security:
        - header-auth: []
        - cookie-auth: []
      tags:
        - artists
  /api/user/{id}/activation:
    parameters:
      - name: id
        schema:
          type: integer
        in: path
        required: true
    put:
      summary: Activate user
      tags:
        - artists
      responses:
        '204':
          description: Successfully activated the user
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: activate_user
      security:
        - header-auth: []
        - cookie-auth: []
      description: Activates the user with the given id
    delete:
      summary: Deactivate user
      tags:
        - artists
      responses:
        '204':
          description: Successfully deactivated the user
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '409':
          description: Cannot deactivate last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: deactivate_user
      description: Deactivates the user with the given id
      security:
        - header-auth: []
        - cookie-auth: []
  /api/user/{id}/totp:
    parameters:
      - name: id
        schema:
          type: integer
        in: path
        required: true
    delete:
      summary: Reset totp for the given user
      tags:
        - artists
      responses:
        '204':
          description: Successfully reset totp for the given user
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: reset_user_totp
      description: Reset the totp configuration to email for the given user
      security:
        - header-auth: []
        - cookie-auth: []
  /api/user/{id}/profilepicture:
    parameters:
      - name: id
        schema:
          type: integer
        in: path
        required: true
    put:
      summary: Update user profile picture by id
      responses:
        '204':
          description: Successfully updated users profile picture
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: upload_user_profilepicture
      description: Updates the users profile picture
      security:
        - header-auth: []
        - cookie-auth: []
      requestBody:
        content:
          image/apng:
            schema:
              type: string
              format: binary
          image/avif:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/svg+xml:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      tags:
        - artists
    delete:
      summary: Delete user profile picture by id
      responses:
        '204':
          description: Users profile picture successfully deleted
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: delete_user_profilepicture
      security:
        - header-auth: []
        - cookie-auth: []
      description: Deletes the given users profile picture
      tags:
        - artists
    get:
      summary: Get user profile picture by id
      responses:
        '200':
          description: Successfully got the profile picture
          content:
            image/apng:
              schema:
                type: string
                format: binary
            image/avif:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: get_user_profilepicture
      description: Gets the users profile picture
      security:
        - header-auth: []
        - cookie-auth: []
      tags:
        - artists
  /api/login:
    post:
      summary: Login
      tags:
        - authentication
      responses:
        '200':
          description: Successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/login-result'
        '403':
          description: Bad Credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: login
      description: With the login api a user can be logged in. If the device code is empty, you need to provide a two factor code. If the two factor code is empty, you need to provide a device code.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/login-request'
      parameters:
        - name: JinyaDeviceCode
          description: The Jinya Device Code contains the identification for a known device
          schema:
            type: string
          in: header
      security: []
    head:
      summary: Check the validity of a Jinya Api Key
      tags:
        - authentication
      responses:
        '204':
          description: Api Key is valid
        '401':
          description: Api key is invalid
      operationId: check_api_key
      description: Check if the api key provided in the header is still valid.
      security:
        - header-auth: []
        - cookie-auth: []
  /api/logout:
    delete:
      summary: Logout
      tags:
        - authentication
      parameters:
        - name: fully
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '204':
          description: Successfully logged out
      operationId: logout
      description: Logs the user out and deletes the api key
      security: []
  /api/account/password:
    put:
      summary: Change password
      tags:
        - authentication
      responses:
        '204':
          description: Successfully changed the password
        '400':
          description: New password is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '401':
          description: Authentication Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Old Password is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: change_password
      description: Updates the password of the current user
      security:
        - header-auth: []
        - cookie-auth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/change-password-request'
  /api/2fa:
    post:
      summary: Request two-factor code
      tags:
        - authentication
      responses:
        '204':
          description: Successfully sent two-factor code
        '403':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '500':
          description: Sending of the email failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: request_two_factor_code
      description: This request creates a new two-factor token and sends it to the provided user
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/request-two-factor-code'
  /api/blog-category:
    get:
      summary: List blog categories
      responses:
        '200':
          description: Successfully returned all blog categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blog-category-list'
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: get_all_blog_categories
      description: Gets a list of all blog categories
      tags:
        - blog-categories
      security:
        - header-auth: []
        - cookie-auth: []
    post:
      summary: Create blog category
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blog-category'
        '400':
          description: Missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '409':
          description: Name is in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: create_blog_category
      description: Creates a new blog category
      security:
        - header-auth: []
        - cookie-auth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-blog-category-request'
      tags:
        - blog-categories
  /api/blog-category/{id}:
    parameters:
      - name: id
        schema:
          type: integer
        in: path
        required: true
    put:
      summary: Update blog category by id
      responses:
        '204':
          description: Successfully updated blog category
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: Page not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '409':
          description: Name is not unique
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: update_blog_category
      description: Updates the blog category with the given id
      security:
        - header-auth: []
        - cookie-auth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-blog-category-request'
      tags:
        - blog-categories
    delete:
      summary: Delete blog category by id
      responses:
        '204':
          description: Blog category successfully deleted
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: Blog category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: delete_blog_category
      security:
        - header-auth: []
        - cookie-auth: []
      description: Deletes the given blog category
      tags:
        - blog-categories
    get:
      summary: Get blog category by id
      responses:
        '200':
          description: Successfully got the blog category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blog-category'
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: Blog category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: get_blog_category_by_id
      description: Gets the blog category with the given id
      security:
        - header-auth: []
        - cookie-auth: []
      tags:
        - blog-categories
  /api/blog-category/{id}/post:
    parameters:
      - name: id
        schema:
          type: integer
        in: path
        required: true
    get:
      summary: Get blog posts by category id
      responses:
        '200':
          description: Successfully got the blog posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blog-post-list'
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '404':
          description: Blog category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: get_blog_posts_by_category_id
      description: Gets the blog posts for the given category
      security:
        - header-auth: []
        - cookie-auth: []
      tags:
        - blog-categories
  /api/blog-post:
    get:
      summary: List blog posts
      responses:
        '200':
          description: Successfully returned all blog posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blog-post-list'
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: get_all_blog_posts
      description: Gets a list of all blog posts in all categories
      tags:
        - blog-posts
      security:
        - header-auth: []
        - cookie-auth: []
    post:
      summary: Create blog post
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blog-post'
        '400':
          description: Missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '401':
          description: Api key missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '403':
          description: Invalid api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
        '409':
          description: Slug or title is in use. Also the category or header image could not exists, check the exception details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exception'
      operationId: create_blog_post
      description: Creates a new blog post
      security:
        - header-auth: []
        - cookie-auth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-blog-post-request'
      tags:
        - blog-posts
  /api/blog-post/{id}:
    parameters:
      - name: id
        schema:
          type: integer
        in: path
        required: true
    put:
      summary: Update blog post by id
