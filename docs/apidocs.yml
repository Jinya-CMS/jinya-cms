components:
  securitySchemes:
    header-auth:
      type: http
      scheme: bearer
      description: A Jinya API Key is generated after a user successfully logged in and returned in the response body of the login response
    cookie-auth:
      type: apiKey
      in: cookie
      name: JinyaApiKey
      description: A Jinya API Key is generated after a user successfully logged in and returned in the response body of the login response
  schemas:
    api-key:
      title: Api key
      type: object
      description: The ApiKey is used to authenticate a user against the Jinya API
      properties:
        key:
          type: string
        remoteAddress:
          type: string
          format: ipv4
        userAgent:
          type: string
        validSince:
          type: string
          format: date-time
      required:
        - key
        - remoteAddress
        - userAgent
        - validSince
    api-key-list:
      title: A list of api keys
      type: object
      properties:
        offset:
          type: integer
        itemsCount:
          type: integer
        totalCount:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/api-key'
      required:
        - offset
        - itemsCount
        - totalCount
        - items
    error:
      title: Error details
      type: object
      description: All information about an error
      properties:
        message:
          type: string
        type:
          type: string
      required:
        - message
        - type
    exception:
      title: Exception result
      description: Data returned if an error occurs
      type: object
      properties:
        success:
