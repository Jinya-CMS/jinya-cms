deploy-beta-package:
  extends:
    - .deploy-package
  variables:
    PACKAGE_VERSION: $LATEST_BETA
    TRACK: $BETA_TRACK
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $LATEST_BETA_BRANCH

deploy-alpha-package:
  extends:
    - .deploy-package
  variables:
    PACKAGE_VERSION: $LATEST_ALPHA
    TRACK: $ALPHA_TRACK
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $LATEST_ALPHA_BRANCH

deploy-release-package:
  extends:
    - .deploy-package
  variables:
    PACKAGE_VERSION: $LATEST
    TRACK: $RELEASE_TRACK
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG

pages:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/oven/bun:latest
  stage: deploy-pages
  script:
    - rm -rf public/
    - bunx @redocly/cli bundle openapi/v26/openapi.yaml > docs/apidocs.yml
    - cd docs
    - bun docusaurus gen-api-docs all
    - cd ..
    - mv docs/ public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $LATEST_ALPHA_BRANCH
